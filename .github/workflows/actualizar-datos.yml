name: Actualizar precios de combustibles

"on":
  workflow_dispatch:
    inputs:
      url_xml:
        description: "URL del XML (opcional, para probar otro origen)"
        required: false
        default: ""
  schedule:
    # Diario 13:00 UTC = 07:00 en el centro de Mexico
    - cron: "0 13 * * *"
    # Lunes 14:00 UTC = 08:00 en el centro de Mexico (corte semanal)
    - cron: "0 14 * * 1"

permissions:
  contents: write

env:
  # Endpoint de datos de la Comision Nacional de Energia.
  # OJO: la ruta va SIN acentos -> /publicaciones/prices
  URL_POR_OMISION: "https://publicacionexterna.azurewebsites.net/publicaciones/prices"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el XML oficial
        id: descarga
        run: |
          URL="${{ github.event.inputs.url_xml }}"
          ORIGEN="campo del formulario"
          if [ -z "$URL" ]; then URL="${{ vars.URL_XML }}"; ORIGEN="variable URL_XML de Settings"; fi
          if [ -z "$URL" ]; then URL="$URL_POR_OMISION"; ORIGEN="valor por omision del flujo"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Origen de la URL: $ORIGEN"
          echo "URL: $URL"

          # --compressed: si el servidor responde comprimido, curl lo descomprime.
          # Sin -f para poder leer el codigo HTTP en lugar de morir en silencio.
          CODIGO=$(curl -sSL --compressed --retry 3 --retry-all-errors --max-time 180 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -H "Accept: application/xml,text/xml,*/*" \
            -o precios_del_dia.xml -w "%{http_code}" "$URL" || echo "000")

          BYTES=$(wc -c < precios_del_dia.xml 2>/dev/null || echo 0)
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "HTTP $CODIGO · $BYTES bytes"

      - name: Revisar que sea el padron de precios
        id: validacion
        run: |
          python3 - <<'PY' > diagnostico.txt 2>&1 || true
          import sys, xml.etree.ElementTree as ET

          try:
              with open("precios_del_dia.xml", "rb") as fh:
                  datos = fh.read()
          except OSError as e:
              print("resultado: NO_SE_PUDO_LEER (%s)" % e); sys.exit(0)

          print("bytes: %d" % len(datos))
          print("primeros 160 bytes: %r" % datos[:160])

          if datos[:2] == b"\x1f\x8b":
              print("aviso: llego comprimido en gzip")
          if datos[:2] in (b"\xff\xfe", b"\xfe\xff"):
              print("aviso: llego en UTF-16")
          if datos[:3] == b"\xef\xbb\xbf":
              print("aviso: trae BOM UTF-8 (se ignora al interpretar)")
              datos = datos[3:]
          datos = datos.lstrip()

          try:
              raiz = ET.fromstring(datos)
          except ET.ParseError as e:
              print("resultado: NO_ES_XML (%s)" % e); sys.exit(0)

          hijos = list(raiz)
          print("raiz: <%s> atributos=%s" % (raiz.tag, dict(raiz.attrib)))
          print("hijos: %d · etiquetas: %s" % (len(hijos), sorted({h.tag for h in hijos[:50]})))

          # Esquema A: <precios><estacion permiso><producto tipo precio>
          # Esquema B: <places><place place_id><gas_price type>   (el vigente)
          if hijos and hijos[0].tag == "estacion":
              print("esquema: precios/estacion"); print("resultado: OK"); sys.exit(0)
          if hijos and hijos[0].tag == "place" and hijos[0].find("gas_price") is not None:
              print("esquema: places/place con gas_price"); print("resultado: OK"); sys.exit(0)
          if hijos and hijos[0].tag == "place":
              print("resultado: ES_EL_CATALOGO_NO_LOS_PRECIOS"); sys.exit(0)
          print("resultado: XML_DE_OTRA_COSA"); sys.exit(0)
          PY

          cat diagnostico.txt
          if grep -q "^resultado: OK$" diagnostico.txt; then
            echo "omitir=0" >> "$GITHUB_OUTPUT"
          else
            echo "omitir=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Convertir, acumular y generar el reporte de mercado
        if: steps.validacion.outputs.omitir == '0'
        run: |
          python3 xml_a_csv.py precios_del_dia.xml \
                  --catalogo catalogo_estaciones.csv \
                  --fecha "$(date -u +%Y-%m-%d)" \
                  --salida fallback.csv \
                  --acumular --conservar 7 \
                  --historico historico.csv --historico-conservar 120 \
                  --reporte reporte_mercado.csv

      - name: Generar el histórico en Excel
        if: steps.validacion.outputs.omitir == '0'
        run: |
          pip install --quiet openpyxl
          python3 historico_a_xlsx.py historico.csv historico.xlsx

      - name: Regenerar las instancias de clientes
        if: steps.validacion.outputs.omitir == '0'
        run: |
          # Cada instancia se regenera con el corte recien publicado, de modo
          # que el cliente abra su tablero con los precios de esa manana.
          python3 preparar_cliente.py --origen . --salida clientes/enerso \
                  --slug enerso --nombre "ENERSO · Inteligencia de Combustibles" \
                  --subtitulo "Monitoreo y Estrategia Comercial de Precios (SENER / CNE / SAT)" \
                  --estado Jalisco --radio 5 --max-estaciones 10 \
                  --centro "20.6736,-103.3440" --zoom 12 \
                  --xlsx historico.xlsx
          echo "Instancias regeneradas:"
          ls -1 clientes/

      - name: Publicar si hubo cambios
        if: steps.validacion.outputs.omitir == '0'
        run: |
          # No se borra diagnostico.txt aqui: el paso del resumen lo publica.
          rm -f precios_del_dia.xml
          if git diff --quiet -- fallback.csv historico.csv reporte_mercado.csv historico.xlsx clientes/; then
            echo "Sin cambios: la fecha ya estaba cargada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fallback.csv historico.csv reporte_mercado.csv historico.xlsx clientes/
          git commit -m "Precios $(date -u +%Y-%m-%d)"
          git push

      - name: Resumen de la corrida
        if: always()
        run: |
          {
            if [ "${{ steps.validacion.outputs.omitir }}" = "0" ]; then
              echo "### Datos actualizados"
              echo ""
              echo "Periodos en fallback.csv: $(cut -d, -f1 fallback.csv | tail -n +2 | sort -u | tr '\n' ' ')"
            else
              echo "### Sin datos nuevos"
              echo ""
              echo "El tablero sigue sirviendo el ultimo corte publicado."
            fi
            echo ""
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| HTTP | ${{ steps.descarga.outputs.codigo }} |"
            echo "| Bytes recibidos | ${{ steps.descarga.outputs.bytes }} |"
            echo "| URL usada | \`${{ steps.descarga.outputs.url }}\` |"
            echo ""
            echo "**Que traia el archivo**"
            echo ""
            echo '```'
            cat diagnostico.txt 2>/dev/null || echo "(sin diagnostico: la descarga no llego a ejecutarse)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f precios_del_dia.xml diagnostico.txt
